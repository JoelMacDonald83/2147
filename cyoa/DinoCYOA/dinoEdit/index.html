<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dino CYOA Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- NEW: a static header. The tab strip is painted by render(); the status
       line and the Save button are shared by every tab, so they live here and
       survive every repaint (Save is wired ONCE in main.js). -->
  <header class="topbar">
    <h1>CYOA Editor</h1>
    <nav id="tabs"></nav>
    <div class="toolbar">
      <span id="status"></span>
      <button id="save" class="save-button">Save all</button>
    </div>
  </header>
  <div id="editor"></div>
  <script src="main.js" type="module"></script>
</body>
</html>
